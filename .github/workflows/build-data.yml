name: Refresh data and deploy

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL dependencies
        run: pip install h3

      - name: Run pipeline
        run: python3 etl/pipeline.py --res 5

      - name: Commit updated data
        run: |
          git config user.name "brotosphere-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hexes.geojson
          git diff --quiet --cached || git commit -m "Monthly data refresh"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
