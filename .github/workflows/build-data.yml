name: Build hex grid and deploy

# Raw data collection now happens manually via Colab (see
# etl/colab_state_fetch.py) rather than here -- this workflow just
# rebuilds data/hexes.geojson from whatever's already committed under
# data/raw/ and data/venues.csv, then deploys. No Overpass calls, no
# multi-hour runs; this should finish in well under a minute.
#
# If you ever want the old behavior back (this Action fetching directly
# from Overpass on a schedule), the previous version of this file ran
# etl/fetch_osm_pois.py as an extra step before "Build hex grid" below.

on:
  workflow_dispatch: {}    # manual runs from the Actions tab
  push:
    paths:
      - "data/raw/**"
      - "data/venues.csv"
      - "etl/build_h3_grid.py"
      - "etl/compute_metrics.py"
      - "etl/us_states.py"
      - "etl/venues.py"

# Pushing several files close together (e.g. uploading a batch of changed
# files one at a time) used to kick off multiple overlapping runs, each
# trying to commit+push data/hexes.geojson -- whichever finished first
# would win, and every other one would get rejected with "remote contains
# work you do not have locally." This queues runs instead of racing them:
# a new run waits for the current one to finish rather than starting in
# parallel with it.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install h3

      - name: Build hex grid
        run: python3 etl/build_h3_grid.py --res 5

      - name: Compute metrics
        run: python3 etl/compute_metrics.py

      - name: Commit hex data
        run: |
          git config user.name "brotosphere-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hexes.geojson
          git diff --quiet --cached || git commit -m "Rebuild hex grid"

          # Belt-and-suspenders on top of the concurrency lock above: if
          # anything else still lands on main between checkout and push
          # (e.g. a manual edit via the GitHub web UI), retry a few times
          # with a rebase instead of failing outright.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) -- pulling and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 2))
          done

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
